apiVersion: v1
kind: Namespace
metadata:
  name: portal-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eks-portal-sa
  namespace: portal-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eks-portal-role
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "pods/log", "namespaces", "services"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale", "replicasets"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eks-portal-role-binding
subjects:
  - kind: ServiceAccount
    name: eks-portal-sa
    namespace: portal-system
roleRef:
  kind: ClusterRole
  name: eks-portal-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eks-portal-deployment
  namespace: portal-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eks-portal
  template:
    metadata:
      labels:
        app: eks-portal
    spec:
      serviceAccountName: eks-portal-sa
      containers:
        - name: eks-portal-container
          image: eks-portal:placeholder  # Pipeline isse replace kar degi
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
